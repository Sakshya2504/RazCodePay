name: RazCodePay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package.json
            web/package.json
      - name: Server install
        working-directory: server
        run: npm install
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Server syntax check
        run: find server/src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Frontend install
        working-directory: web
        run: npm install
      - name: Frontend build
        working-directory: web
        run: npm run build
