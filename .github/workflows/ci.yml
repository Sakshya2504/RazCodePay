name: RazCodePay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package.json
            web/package.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Check server JavaScript syntax
        run: |
          set -e
          find server/src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build React console
        working-directory: web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python scorer
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          printf '%s' '{"amount_minor":49900,"attempts":0,"has_consent":true,"has_prior_success":true}' | python risk_scorer.py
